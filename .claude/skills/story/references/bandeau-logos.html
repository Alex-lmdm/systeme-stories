<!-- PATRON — bandeau de logos qui s'affichent l'un apres l'autre (story « dupliq.me », 26/08/2026).
     A COPIER dans stories/<slug>/logos.html, puis adapter : les data-start / les temps GSAP
     (= les timings des mots dans story.json), les 4 <img>, la duree totale.
     Rendu en calque transparent :
       npx hyperframes render -c stories/<slug>/logos.html --format mov -o stories/<slug>/logos.mov
     Declare ensuite dans story.json (PLEIN CADRE : w = 1080, y = 960) :
       "overlays": [{"src": "stories/<slug>/logos.mov", "start": …, "end": …, "y": 960, "w": 1080}]
     Les chemins d'assets sont relatifs a stories/<slug>/ -> ../../assets/logos/… -->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="../../assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #logos { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #logos .row { position: absolute; left: 0; top: 1100px; width: 1080px; height: 160px;
        display: flex; justify-content: center; align-items: center; gap: 50px; }
      #logos .lg { width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,.45)); }
      #logos .lg img { width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="logos" data-composition-id="logos" data-start="0" data-duration="3.6"
         data-fps="30" data-width="1080" data-height="1920">
      <div class="row">
        <div class="lg clip" id="lg-0" data-start="0.00" data-duration="3.60" data-track-index="0"><img src="../../assets/logos/tiktok.svg" alt="TikTok"></div>
        <div class="lg clip" id="lg-1" data-start="0.74" data-duration="2.86" data-track-index="1"><img src="../../assets/logos/instagram.svg" alt="Instagram"></div>
        <div class="lg clip" id="lg-2" data-start="1.35" data-duration="2.25" data-track-index="2"><img src="../../assets/logos/youtube.svg" alt="YouTube Shorts"></div>
        <div class="lg clip" id="lg-3" data-start="2.20" data-duration="1.40" data-track-index="3"><img src="../../assets/logos/facebook.svg" alt="Facebook"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // Entree : opacity + scale UNIQUEMENT (jamais x/y), un seul selecteur par tween.
        const IN = [["#logos #lg-0", 0.00], ["#logos #lg-1", 0.74],
                    ["#logos #lg-2", 1.35], ["#logos #lg-3", 2.20]];
        IN.forEach(function (e) {
          tl.fromTo(e[0], { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.40, ease: "back.out(2)" }, e[1]);
        });
        // Le groupe est dimensionne pour 4 logos : tant qu'il en manque, il est decentre vers la
        // gauche. On le recentre a chaque arrivee (demi-pas = (160+50)/2 = 105 px).
        // x sur le CONTENEUR, pas sur un element time -> pas de conflit avec le translate du studio.
        gsap.set("#logos .row", { x: 315 });
        [[0.00, 315], [0.74, 210], [1.35, 105], [2.20, 0]].forEach(function (e) {
          tl.to("#logos .row", { x: e[1], duration: 0.40, ease: "power3.out" }, e[0]);
        });
        tl.to("#logos .row", { opacity: 0, duration: 0.30, ease: "power2.in" }, 3.30);
        window.__timelines["logos"] = tl;
      })();
    </script>
  </body>
</html>
